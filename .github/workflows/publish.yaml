name: Publish NuGet Package

on:
  push:
    branches:
      - "main"
      - "prerelease"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  PACKAGE_ID: 'Contour'
  PROJECT_PATH: './src'
  PROJECT_FILE: './Sources/Contour/Contour.csproj'
  GITHUB_FEED: 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'
  NUGET_ORG_FEED: 'https://api.nuget.org/v3/index.json'

defaults:
  run:
    shell: bash

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.check.outputs.source_changed }}
      docs_changed: ${{ steps.check.outputs.docs_changed }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      branch_kind: ${{ steps.check.outputs.branch_kind }}
      version_changed: ${{ steps.check.outputs.version_changed }}
      suffix_identifier: ${{ steps.check.outputs.suffix_identifier }}
      version_suffix: ${{ steps.check.outputs.version_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: check
        run: bash ./.github/scripts/detect_changes.sh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROJECT_FILE: ${{ env.PROJECT_FILE }}
          EVENT_BEFORE: ${{ github.event.before }}

  version:
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: write
    env:
      FAILURE_LOG: ${{ github.workspace }}/publish-version-failure.log
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      effective_version: ${{ steps.version.outputs.effective_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize failure log
        run: rm -f "$FAILURE_LOG"

      - name: Compute and (optionally) commit new version
        id: version
        run: bash ./.github/scripts/read_version.sh publish
        env:
          PROJECT_FILE: ${{ env.PROJECT_FILE }}

      - name: Check version bump
        if: needs.detect-changes.outputs.source_changed == 'true'
        env:
          GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set -uo pipefail
          exec > >(tee -a "$FAILURE_LOG") 2>&1
          CURRENT_VERSION="${{ steps.version.outputs.effective_version }}"
          if [[ -z "${CURRENT_VERSION}" ]]; then
            CURRENT_VERSION="${{ steps.version.outputs.new_version }}"
          fi
          if [[ -z "${CURRENT_VERSION}" ]]; then
            CURRENT_VERSION=$(grep -oP '<Version>\K[^<]+' "${{ env.PROJECT_FILE }}")
          fi
          echo "csproj version: ${CURRENT_VERSION}"
          set +e
          bash ./.github/scripts/check_version_bumped.sh nuget-feed "${CURRENT_VERSION}"
          STATUS=$?
          set -e
          echo "${STATUS}" > version_check_status.txt
          exit "${STATUS}"

      - name: Capture version failure snippet
        id: capture_version_snippet
        if: needs.detect-changes.outputs.source_changed == 'true'
        run: |
          STATUS=$(cat version_check_status.txt 2>/dev/null || echo 0)
          if [[ "${STATUS}" != "0" ]]; then
            tail -n 80 "$FAILURE_LOG" > publish_version_failure_snippet.txt || echo "No version log output" > publish_version_failure_snippet.txt
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload version failure snippet
        if: steps.capture_version_snippet.outputs.has_failure == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publish-version-failure-snippet
          path: publish_version_failure_snippet.txt
          retention-days: 7

      - name: Enforce version bump result
        if: needs.detect-changes.outputs.source_changed == 'true'
        run: |
          STATUS=$(cat version_check_status.txt 2>/dev/null || echo 0)
          if [[ "${STATUS}" != "0" ]]; then
            echo "Version bump enforcement failed (status ${STATUS})."
            exit "${STATUS}"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [detect-changes, version]
    if: always() && (needs.detect-changes.outputs.source_changed == 'true' || needs.version.outputs.new_version != '' || needs.version.outputs.effective_version != '')
    env:
      FAILURE_LOG: ${{ github.workspace }}/publish-build-failure.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize failure log
        run: rm -f "$FAILURE_LOG"

      - name: Setup .NET (with cache)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/global.json
            **/packages.lock.json

      - name: Determine effective version
        id: eff
        run: |
          if [[ -n "${{ needs.version.outputs.effective_version }}" ]]; then
            echo "version=${{ needs.version.outputs.effective_version }}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ needs.version.outputs.new_version }}" ]]; then
            echo "version=${{ needs.version.outputs.new_version }}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -oP '<Version>\K[^<]+' "${{ env.PROJECT_FILE }}")
            echo "version=${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          dotnet restore |& tee -a "$FAILURE_LOG"

      - name: Build
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          dotnet build --configuration Release --no-restore |& tee -a "$FAILURE_LOG"

      - name: Test
        if: false
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          dotnet test --configuration Release --no-build --verbosity normal |& tee -a "$FAILURE_LOG"

      - name: Pack (deterministic files, include symbols)
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.eff.outputs.version }}"
          dotnet pack \
            --configuration Release \
            --no-build \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            --output ./nupkgs |& tee -a "$FAILURE_LOG"

          echo "Created packages:"
          ls -la ./nupkgs |& tee -a "$FAILURE_LOG"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/nupkgs/
          retention-days: 30

      - name: Capture build failure snippet
        if: failure()
        run: |
          tail -n 80 "$FAILURE_LOG" > publish_build_failure_snippet.txt || echo "No build log output" > publish_build_failure_snippet.txt

      - name: Upload build failure snippet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-build-failure-snippet
          path: publish_build_failure_snippet.txt
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [detect-changes, version, build]
    if: needs.build.result == 'success'
    permissions:
      contents: write
      packages: write
    env:
      NUGET_PUBLISH_TOKEN: ${{ secrets.NUGET_PUBLISH_TOKEN }}
      GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_PUBLISH_TOKEN }}
      DEFAULT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAILURE_LOG: ${{ github.workspace }}/publish-job-failure.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize failure log
        run: rm -f "$FAILURE_LOG"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: ./packages

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          exec > >(tee -a "$FAILURE_LOG") 2>&1
          if [[ -n "${{ needs.version.outputs.effective_version }}" ]]; then
            VERSION="${{ needs.version.outputs.effective_version }}"
          elif [[ -n "${{ needs.version.outputs.new_version }}" ]]; then
            VERSION="${{ needs.version.outputs.new_version }}"
          else
            VERSION=$(grep -oP '<Version>\K[^<]+' "${{ env.PROJECT_FILE }}")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Create and push tag
        run: |
          set -euo pipefail
          exec > >(tee -a "$FAILURE_LOG") 2>&1
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v${VERSION}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          exec > >(tee -a "$FAILURE_LOG") 2>&1

          VERSION="${{ steps.ver.outputs.version }}"
          PACKAGE_FILE=$(ls ./packages/*.nupkg | head -1)
          
          echo "Publishing package $PACKAGE_FILE to GitHub Packages..."
          
          # Use organization token for publishing
          if [[ -n "$NUGET_PUBLISH_TOKEN" ]]; then
            echo "Using NUGET_PUBLISH_TOKEN from organization secrets"
            TOKEN="$NUGET_PUBLISH_TOKEN"
          else
            echo "Using GITHUB_TOKEN"
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          echo "Published to GitHub Packages."          
          
          # Publish with token
          if dotnet nuget push "$PACKAGE_FILE" \
            --api-key "$TOKEN" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate; then
            echo "Successfully published to GitHub Packages"
          else
            echo "Failed to publish to GitHub Packages"
            exit 1
          fi

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Release v${{ steps.ver.outputs.version }}
          body: |
            Automated release of ${{ env.PACKAGE_ID }} ${{ steps.ver.outputs.version }}.
          draft: false
          prerelease: ${{ needs.detect-changes.outputs.branch_kind != 'main' }}
          files: |
            ./packages/*.nupkg
            ./packages/*.snupkg

      - name: Capture publish failure snippet
        if: failure()
        run: |
          tail -n 80 "$FAILURE_LOG" > publish_job_failure_snippet.txt || echo "No publish log output" > publish_job_failure_snippet.txt

      - name: Upload publish failure snippet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-job-failure-snippet
          path: publish_job_failure_snippet.txt
          retention-days: 7

  summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, version, build, publish]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build failure snippet
        if: needs.build.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: publish-build-failure-snippet
          path: diagnostics/publish-build

      - name: Download publish failure snippet
        if: needs.publish.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: publish-job-failure-snippet
          path: diagnostics/publish-job

      - name: Download version failure snippet
        if: needs.version.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: publish-version-failure-snippet
          path: diagnostics/publish-version

      - name: Generate summary
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BRANCH_KIND="${{ needs.detect-changes.outputs.branch_kind }}"
          COMMIT="${{ github.sha }}"
          TRIGGER="${{ github.event_name }}"
          SOURCE_CHANGED="${{ needs.detect-changes.outputs.source_changed }}"
          DOCS_CHANGED="${{ needs.detect-changes.outputs.docs_changed }}"
          VERSION_CHANGED="${{ needs.detect-changes.outputs.version_changed }}"
          VERSION_SUFFIX="${{ needs.detect-changes.outputs.version_suffix }}"
          BUILD_RESULT="${{ needs.build.result }}"
          PUBLISH_RESULT="${{ needs.publish.result }}"
          EFFECTIVE_VERSION="${{ needs.version.outputs.effective_version }}"
          NEW_VERSION="${{ needs.version.outputs.new_version }}"

          SOURCE_STATUS="No changes"
          if [[ "${SOURCE_CHANGED}" == "true" ]]; then
            SOURCE_STATUS="Modified"
          fi

          DOCS_STATUS="No changes"
          if [[ "${DOCS_CHANGED}" == "true" ]]; then
            DOCS_STATUS="Updated"
          fi

          VERSION_STATUS="Using csproj metadata"
          if [[ "${VERSION_CHANGED}" == "true" ]]; then
            VERSION_STATUS="Version bumped in csproj"
          elif [[ "${SOURCE_CHANGED}" == "true" ]]; then
            VERSION_STATUS="Source changed (version bump enforced earlier)"
          fi

          BASE_VERSION="${NEW_VERSION:-${EFFECTIVE_VERSION}}"
          if [[ -z "${BASE_VERSION}" ]]; then
            BASE_VERSION=$(grep -oP '<Version>\K[^<]+' "${{ env.PROJECT_FILE }}" || echo "unknown")
          fi

          EFFECTIVE_LABEL="${EFFECTIVE_VERSION:-$BASE_VERSION}"
          if [[ -z "${EFFECTIVE_LABEL}" ]]; then
            EFFECTIVE_LABEL="unknown"
          fi

          if [[ -n "${VERSION_SUFFIX}" ]]; then
            FULL_VERSION="${EFFECTIVE_LABEL}${VERSION_SUFFIX}"
            SUFFIX_LABEL="${VERSION_SUFFIX}"
          else
            FULL_VERSION="${EFFECTIVE_LABEL}"
            SUFFIX_LABEL="None"
          fi

          case "${BRANCH_KIND}" in
            main)
              TARGETS="NuGet.org + GitHub release"
              ;;
            prerelease)
              TARGETS="Prerelease tag + GitHub release"
              ;;
            *)
              TARGETS="GitHub release"
              ;;
          esac

          echo "## Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${REPO} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${BRANCH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch Kind | ${BRANCH_KIND} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${COMMIT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${TRIGGER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source Changes | ${SOURCE_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Documentation | ${DOCS_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Status | ${VERSION_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Published Version | ${EFFECTIVE_LABEL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Computed Run Suffix | ${SUFFIX_LABEL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Job | ${{ needs.version.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Job | ${BUILD_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Publish Job | ${PUBLISH_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Expected Targets | ${TARGETS} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Version Details" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base csproj version: \`${BASE_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${VERSION_SUFFIX}" ]]; then
            echo "- Combined version hint (base + suffix): \`${FULL_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Combined version hint: suffix not applied" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Release tag created: \`v${EFFECTIVE_LABEL}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build & Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build status: ${BUILD_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publish status: ${PUBLISH_RESULT}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${BRANCH_KIND}" != "main" ]]; then
            echo "- NuGet.org push is skipped for non-main branches" >> "$GITHUB_STEP_SUMMARY"
          fi

          VERSION_JOB_RESULT="${{ needs.version.result }}"
          BUILD_RESULT="${{ needs.build.result }}"
          PUBLISH_JOB_RESULT="${{ needs.publish.result }}"
          if [[ ( -n "${VERSION_JOB_RESULT}" && "${VERSION_JOB_RESULT}" != "success" ) || ( -n "${BUILD_RESULT}" && "${BUILD_RESULT}" != "success" ) || ( -n "${PUBLISH_JOB_RESULT}" && "${PUBLISH_JOB_RESULT}" != "success" ) ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failure Details" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "${VERSION_JOB_RESULT}" && "${VERSION_JOB_RESULT}" != "success" ]]; then
              echo "- Version job concluded with status: \`${VERSION_JOB_RESULT}\`." >> "$GITHUB_STEP_SUMMARY"
              VERSION_SNIPPET="diagnostics/publish-version/publish_version_failure_snippet.txt"
              if [[ -s "${VERSION_SNIPPET}" ]]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "<details><summary>Version check excerpt</summary>" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                cat "${VERSION_SNIPPET}" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if [[ -n "${BUILD_RESULT}" && "${BUILD_RESULT}" != "success" ]]; then
              echo "- Build job concluded with status: \`${BUILD_RESULT}\`." >> "$GITHUB_STEP_SUMMARY"
              BUILD_SNIPPET="diagnostics/publish-build/publish_build_failure_snippet.txt"
              if [[ -s "${BUILD_SNIPPET}" ]]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "<details><summary>Build log excerpt</summary>" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                cat "${BUILD_SNIPPET}" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            if [[ -n "${PUBLISH_JOB_RESULT}" && "${PUBLISH_JOB_RESULT}" != "success" ]]; then
              echo "- Publish job concluded with status: \`${PUBLISH_JOB_RESULT}\`." >> "$GITHUB_STEP_SUMMARY"
              PUBLISH_SNIPPET="diagnostics/publish-job/publish_job_failure_snippet.txt"
              if [[ -s "${PUBLISH_SNIPPET}" ]]; then
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "<details><summary>Publish log excerpt</summary>" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                cat "${PUBLISH_SNIPPET}" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "</details>" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
